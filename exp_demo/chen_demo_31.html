<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>Chen-style Hysteresis Demo - Condition Matrix</title>

    <!-- jsPsych 본체 -->
    <script src="https://unpkg.com/jspsych@8.2.3"></script>

    <!-- 필요한 plugin들 -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>

    <!-- jsPsych 기본 CSS -->
    <link href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" rel="stylesheet" type="text/css" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: rgb(166, 166, 166);
      }

      .jspsych-display-element {
        background-color: rgb(166, 166, 166);
      }

      #jspsych-content {
        max-width: none;
      }

      .instruction-screen {
        width: 100vw;
        height: 100vh;
        background-color: rgb(166, 166, 166);
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: black;
        font-family: Arial, sans-serif;
      }

      .instruction-box {
        max-width: 760px;
        line-height: 1.7;
        font-size: 20px;
      }

      .task-screen {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgb(166, 166, 166);
        overflow: hidden;
      }

      .stim-box {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 301px;
        height: 225px;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .stim-img {
        width: 301px;
        height: 225px;
        object-fit: contain;
        display: block;
      }

      .fixation-panel {
        width: 301px;
        height: 225px;
        background-color: rgb(166, 166, 166);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .fixation-cross {
        font-size: 28px;
        color: white;
        font-weight: normal;
        line-height: 1;
      }

      .trial-cue-cross {
        font-size: 32px;
        font-weight: normal;
        line-height: 1;
      }

      .check-feedback {
        position: absolute;
        left: 50%;
        top: calc(50% + 112.5px + 12px);
        transform: translateX(-50%);
        height: 32px;
        font-size: 30px;
        font-weight: bold;
        color: #2b6cb0;
        line-height: 32px;
      }
    </style>
  </head>

  <body></body>

  <script>
    // =========================================================
    // 1. jsPsych 초기화
    // =========================================================
    const jsPsych = initJsPsych({
      on_finish: function() {
        jsPsych.data.displayData();

        // 데이터를 CSV로 저장하고 싶으면 아래 줄의 주석을 해제하면 됨
        // jsPsych.data.get().localSave('csv', 'chen_condition_demo_data.csv');
      }
    });


    // =========================================================
    // 2. 기본 설정
    // =========================================================

    const N_FRAMES = 31;

    // 파일명이 frame_01.png, frame_02.png ... frame_31.png 형식이므로 2자리 사용
    const FRAME_NUMBER_DIGITS = 2;

    // trial 전환 cue
    const TRIAL_CUE_WHITE_DURATION_MS = 1000;
    const TRIAL_CUE_COLOR_DURATION_MS = 200;
    const TRIAL_CUE_COLOR = "#ff3333";


    // =========================================================
    // 3. Condition Matrix 만들기
    // =========================================================

    function make_frame_file(stimulusSet, frameNumber) {
      const frameNumberText = String(frameNumber).padStart(FRAME_NUMBER_DIGITS, '0');

      return `${stimulusSet.stim_path}frame_${frameNumberText}.${stimulusSet.image_extension}`;
    }


    function make_frame_files(stimulusSet, direction_code) {
      const frames = [];

      if (direction_code === 1) {
        // happy_to_angry: frame_01 → frame_31
        for (let i = 1; i <= N_FRAMES; i++) {
          frames.push(make_frame_file(stimulusSet, i));
        }
      } else {
        // angry_to_happy: frame_31 → frame_01
        for (let i = N_FRAMES; i >= 1; i--) {
          frames.push(make_frame_file(stimulusSet, i));
        }
      }

      return frames;
    }


    const stimulusSets = [
      {
        set_id: 1,
        model_code: 'AW',
        stim_path: 'images_31/set01/',
        image_extension: 'png'
      },
      {
        set_id: 2,
        model_code: 'AM',
        stim_path: 'images_31/set02/',
        image_extension: 'png'
      },
      {
        set_id: 3,
        model_code: 'AW2',
        stim_path: 'images_31/set03/',
        image_extension: 'png'
      }
    ];


    const directions = [
      {
        direction_code: 1,
        direction_label: 'happy_to_angry'
      },
      {
        direction_code: 0,
        direction_label: 'angry_to_happy'
      }
    ];


    const repeats = [1, 2];

    const conditionMatrix = [];

    let trialCounter = 1;

    repeats.forEach(repeat => {
      stimulusSets.forEach(stimulusSet => {
        directions.forEach(direction => {
          const condition = {
            trial_id: trialCounter,

            set_id: stimulusSet.set_id,
            model_code: stimulusSet.model_code,
            stim_path: stimulusSet.stim_path,
            image_extension: stimulusSet.image_extension,

            direction_code: direction.direction_code,
            direction_label: direction.direction_label,

            repeat: repeat,
            n_frames: N_FRAMES,
            frame_duration_ms: 200,
            fixation_duration_ms: 300,
            response_key: ' '
          };

          condition.frame_files = make_frame_files(stimulusSet, direction.direction_code);

          conditionMatrix.push(condition);
          trialCounter++;
        });
      });
    });

    console.log('conditionMatrix:', conditionMatrix);


    // =========================================================
    // 4. Preload 이미지 목록 만들기
    // =========================================================
    const preload_images = [
      ...new Set(conditionMatrix.flatMap(condition => condition.frame_files))
    ];

    console.log('preload_images:', preload_images);

    const preload = {
      type: jsPsychPreload,
      images: preload_images,
      message: '이미지를 불러오는 중입니다. 잠시만 기다려 주세요.',
      error_message: '이미지를 불러오지 못했습니다. 이미지 경로, 폴더명, 파일명, 확장자를 확인해 주세요.',
      continue_after_error: false
    };


    // =========================================================
    // 5. Trial 전환 cue 플러그인
    //    흰색 fixation 1초 + 다른 색 fixation 200ms
    // =========================================================
    class TrialTransitionCuePlugin {
      static info = {
        name: 'trial-transition-cue',
        parameters: {}
      };

      constructor(jsPsych) {
        this.jsPsych = jsPsych;
      }

      trial(display_element, trial) {
        const white_duration = trial.white_duration ?? 1000;
        const color_duration = trial.color_duration ?? 200;
        const cue_color = trial.cue_color ?? '#ff3333';

        let timeoutId1 = null;
        let timeoutId2 = null;

        function renderCue(color) {
          display_element.innerHTML = `
            <div class="task-screen">
              <div class="stim-box">
                <div class="fixation-panel">
                  <div class="trial-cue-cross" style="color: ${color};">+</div>
                </div>
              </div>
            </div>
          `;
        }

        renderCue('white');

        timeoutId1 = setTimeout(() => {
          renderCue(cue_color);

          timeoutId2 = setTimeout(() => {
            if (timeoutId1) clearTimeout(timeoutId1);
            if (timeoutId2) clearTimeout(timeoutId2);

            display_element.innerHTML = '';

            this.jsPsych.finishTrial({
              task: 'trial_transition_cue',
              trial_id: trial.data?.trial_id ?? null,
              set_id: trial.data?.set_id ?? null,
              direction_label: trial.data?.direction_label ?? null,
              repeat: trial.data?.repeat ?? null
            });
          }, color_duration);

        }, white_duration);
      }
    }


    // =========================================================
    // 6. 커스텀 플러그인: 반응해도 시퀀스 끝까지 진행
    // =========================================================
    class ChenTransitionPlugin {
      static info = {
        name: 'chen-transition',
        parameters: {}
      };

      constructor(jsPsych) {
        this.jsPsych = jsPsych;
      }

      trial(display_element, trial) {
        const frames = trial.frames;
        const frame_duration = trial.frame_duration ?? 200;
        const isi_duration = trial.isi_duration ?? 300;
        const response_key = trial.response_key ?? ' ';
        const trial_type = trial.trial_type ?? 'smooth';
        const condition_name = trial.condition_name ?? '';
        const transition_frame = trial.transition_frame ?? null;

        console.log('Starting trial:', trial.data);
        console.log('First frame:', frames[0]);
        console.log('Last frame:', frames[frames.length - 1]);

        const CHECK_DURATION_MS = 250;

        let stepIndex = 0;
        let responded = false;
        let response_frame = null;
        let response_rt = null;
        let trialStartTime = performance.now();

        let keyboardListener = null;
        let timeoutId = null;
        let checkTimeoutId = null;

        let currentDisplayMode = 'frame';
        let currentSrc = null;
        let showCheck = false;

        function checkHtml() {
          return showCheck
            ? `<div class="check-feedback">✓</div>`
            : `<div class="check-feedback"></div>`;
        }

        function renderFrame(src) {
          currentDisplayMode = 'frame';
          currentSrc = src;

          display_element.innerHTML = `
            <div class="task-screen">
              <div class="stim-box">
                <img src="${src}" class="stim-img">
              </div>
              ${checkHtml()}
            </div>
          `;
        }

        function renderFixation() {
          currentDisplayMode = 'fixation';
          currentSrc = null;

          display_element.innerHTML = `
            <div class="task-screen">
              <div class="stim-box">
                <div class="fixation-panel">
                  <div class="fixation-cross">+</div>
                </div>
              </div>
              ${checkHtml()}
            </div>
          `;
        }

        function rerenderCurrentScreen() {
          if (currentDisplayMode === 'frame' && currentSrc !== null) {
            renderFrame(currentSrc);
          } else {
            renderFixation();
          }
        }

        function flashCheck() {
          showCheck = true;
          rerenderCurrentScreen();

          if (checkTimeoutId) {
            clearTimeout(checkTimeoutId);
          }

          checkTimeoutId = setTimeout(() => {
            showCheck = false;
            rerenderCurrentScreen();
          }, CHECK_DURATION_MS);
        }

        const endTrial = () => {
          if (keyboardListener) {
            this.jsPsych.pluginAPI.cancelKeyboardResponse(keyboardListener);
          }

          if (timeoutId) {
            clearTimeout(timeoutId);
          }

          if (checkTimeoutId) {
            clearTimeout(checkTimeoutId);
          }

          display_element.innerHTML = '';

          this.jsPsych.finishTrial({
            ...trial.data,

            task: 'chen_style_transition_detection',
            trial_type: trial_type,
            condition: condition_name,
            transition_frame: transition_frame,

            response_frame: response_frame,
            rt: response_rt,
            responded: responded,
            total_frames_shown: frames.length
          });
        };

        keyboardListener = this.jsPsych.pluginAPI.getKeyboardResponse({
          callback_function: () => {
            if (responded) return;

            responded = true;

            // stepIndex는 0부터 시작하므로 1-indexed frame 번호로 저장
            response_frame = stepIndex + 1;

            // 시퀀스 시작부터 첫 반응까지의 시간
            response_rt = performance.now() - trialStartTime;

            // 파란 체크 표시를 순간적으로 보여주기
            flashCheck();
          },
          valid_responses: [response_key],
          rt_method: 'performance',
          persist: true,
          allow_held_key: false
        });

        const runStep = () => {
          if (stepIndex >= frames.length) {
            endTrial();
            return;
          }

          renderFrame(frames[stepIndex]);

          timeoutId = setTimeout(() => {
            renderFixation();

            timeoutId = setTimeout(() => {
              stepIndex++;
              runStep();
            }, isi_duration);

          }, frame_duration);
        };

        runStep();
      }
    }


    // =========================================================
    // 7. 안내문
    // =========================================================
    const instruction = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div class="instruction-screen">
          <div class="instruction-box">
            <h2>표정 변화 탐지 과제</h2>

            <p>얼굴 표정 이미지가 연속적으로 제시됩니다.</p>
            <p>표정이 바뀌었다고 느끼는 순간 <strong>스페이스바</strong>를 누르세요.</p>

            <p>응답이 기록되면 이미지 아래에 <strong style="color:#2b6cb0;">파란색 체크 표시</strong>가 잠깐 나타납니다.</p>
            <p>체크 표시가 나타난 이후에는 다시 누르지 않으셔도 됩니다.</p>

            <br>

            <p>각 시퀀스가 시작되기 전에는 fixation이 제시됩니다.</p>
            <p><strong>흰색 +</strong>가 1초 동안 제시된 뒤, <strong style="color:#ff3333;">빨간색 +</strong>가 0.2초 동안 제시되면 다음 시퀀스가 시작됩니다.</p>

            <br>

            <p>아무 키나 누르면 시작합니다.</p>
          </div>
        </div>
      `
    };


    // =========================================================
    // 8. Trial 전환 cue 만들기
    // =========================================================
    function make_trial_transition_cue(condition) {
      return {
        type: TrialTransitionCuePlugin,

        white_duration: TRIAL_CUE_WHITE_DURATION_MS,
        color_duration: TRIAL_CUE_COLOR_DURATION_MS,
        cue_color: TRIAL_CUE_COLOR,

        data: {
          trial_id: condition.trial_id,
          set_id: condition.set_id,
          direction_label: condition.direction_label,
          repeat: condition.repeat
        }
      };
    }


    // =========================================================
    // 9. Condition row를 jsPsych trial로 변환
    // =========================================================
    function make_condition_trial(condition) {
      return {
        type: ChenTransitionPlugin,

        frames: condition.frame_files,

        frame_duration: condition.frame_duration_ms,
        isi_duration: condition.fixation_duration_ms,
        response_key: condition.response_key,

        trial_type: 'smooth',
        condition_name: condition.direction_label,

        data: {
          phase: 'demo',

          trial_id: condition.trial_id,
          set_id: condition.set_id,
          model_code: condition.model_code,
          stim_path: condition.stim_path,
          image_extension: condition.image_extension,

          direction_code: condition.direction_code,
          direction_label: condition.direction_label,
          repeat: condition.repeat,

          n_frames: condition.n_frames
        }
      };
    }


    // =========================================================
    // 10. Demo trials 만들기
    //     Trial 1 / 12 같은 안내문 없이 fixation cue만 제시
    // =========================================================
    const demo_trials = [];

    conditionMatrix.forEach(condition => {
      demo_trials.push(
        make_trial_transition_cue(condition)
      );

      demo_trials.push(
        make_condition_trial(condition)
      );
    });


    // =========================================================
    // 11. 전체 timeline
    // =========================================================
    const timeline = [
      preload,
      instruction,
      ...demo_trials
    ];


    // =========================================================
    // 12. 실험 실행
    // =========================================================
    jsPsych.run(timeline);
  </script>
</html>
