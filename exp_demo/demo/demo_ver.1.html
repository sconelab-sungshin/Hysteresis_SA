<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Ver.1 Dynamic + Random 3AFC</title>

  <script src="https://unpkg.com/jspsych@8.2.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
  <link href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" rel="stylesheet" type="text/css" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: rgb(166, 166, 166);
    }

    .jspsych-display-element {
      background-color: rgb(166, 166, 166);
    }

    #jspsych-content {
      max-width: none;
    }

    .instruction-screen {
      width: 100vw;
      height: 100vh;
      background-color: rgb(166, 166, 166);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: black;
      font-family: Arial, sans-serif;
    }

    .instruction-box {
      max-width: 940px;
      line-height: 1.7;
      font-size: 20px;
      padding: 24px 32px;
    }

    .task-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgb(166, 166, 166);
      overflow: hidden;
    }

    .stim-box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 301px;
      height: 225px;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .stim-img {
      width: 301px;
      height: 225px;
      object-fit: contain;
      display: block;
    }

    .fixation-panel {
      width: 301px;
      height: 225px;
      background-color: rgb(166, 166, 166);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .fixation-cross {
      font-size: 28px;
      color: white;
      font-weight: normal;
      line-height: 1;
    }

    .check-feedback {
      position: absolute;
      left: 50%;
      top: calc(50% + 112.5px + 12px);
      transform: translateX(-50%);
      height: 32px;
      font-size: 30px;
      font-weight: bold;
      color: #2b6cb0;
      line-height: 32px;
    }

    .response-cue {
      position: absolute;
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: bold;
      color: black;
      background-color: rgba(166, 166, 166, 0.85);
      padding: 4px 8px;
      border-radius: 6px;
      user-select: none;
    }

    .response-cue-neutral {
      left: 50%;
      top: calc(50% - 112.5px - 48px);
      transform: translateX(-50%);
    }

    .response-cue-angry {
      right: calc(50% + 150.5px + 36px);
      top: 50%;
      transform: translateY(-50%);
    }

    .response-cue-happy {
      left: calc(50% + 150.5px + 36px);
      top: 50%;
      transform: translateY(-50%);
    }
  </style>
</head>

<body></body>

<script>
  const jsPsych = initJsPsych({
    show_progress_bar: true,
    on_finish: function() {
      jsPsych.data.displayData();

      // 데이터 저장이 필요하면 아래 줄의 주석을 해제
      // jsPsych.data.get().localSave('csv', 'ver1_dynamic_random_data.csv');
    }
  });

  // =========================================================
  // 1. 기본 설정
  // =========================================================
  const IMAGE_ROOT = 'images_31';

  const N_SETS = 10;

  const N_FRAMES = 31;
  const FRAME_NUMBER_DIGITS = 2;

  // dynamic: image 300ms + fixation 200ms
  // random 3AFC: fixation 200ms + image 300ms
  const FIXATION_DURATION_MS = 200;
  const IMAGE_DURATION_MS = 300;

  const DYNAMIC_REPS = 4;
  const RANDOM_REPS = 3;

  const DYNAMIC_BREAK_EVERY_N_TRIALS = 20;
  const RANDOM_BREAK_EVERY_N_TRIALS = 110;

  // 3AFC 응답키
  // ← angry, ↑ neutral/무표정, → happy
  const RESPONSE_KEYS_3AFC = ['ArrowLeft', 'ArrowUp', 'ArrowRight'];

  function keyToResponseLabel(key) {
    if (!key) return null;

    const normalizedKey = String(key).toLowerCase();

    if (normalizedKey === 'arrowleft') return 'angry';
    if (normalizedKey === 'arrowup') return 'neutral';
    if (normalizedKey === 'arrowright') return 'happy';

    return null;
  }

  // 31장 중 20% 간격으로 선택한 11장
  const SELECTED_LEVELS = [
    { frame: 1,  true_category: 'happy',   emotion_percent: 100, emotion_level_label: 'happy_100' },
    { frame: 4,  true_category: 'happy',   emotion_percent: 80,  emotion_level_label: 'happy_80' },
    { frame: 7,  true_category: 'happy',   emotion_percent: 60,  emotion_level_label: 'happy_60' },
    { frame: 10, true_category: 'happy',   emotion_percent: 40,  emotion_level_label: 'happy_40' },
    { frame: 13, true_category: 'happy',   emotion_percent: 20,  emotion_level_label: 'happy_20' },
    { frame: 16, true_category: 'neutral', emotion_percent: 0,   emotion_level_label: 'happy_0_neutral' },
    { frame: 19, true_category: 'angry',   emotion_percent: 20,  emotion_level_label: 'angry_20' },
    { frame: 22, true_category: 'angry',   emotion_percent: 40,  emotion_level_label: 'angry_40' },
    { frame: 25, true_category: 'angry',   emotion_percent: 60,  emotion_level_label: 'angry_60' },
    { frame: 28, true_category: 'angry',   emotion_percent: 80,  emotion_level_label: 'angry_80' },
    { frame: 31, true_category: 'angry',   emotion_percent: 100, emotion_level_label: 'angry_100' }
  ];

  const STIMULUS_SETS = Array.from({ length: N_SETS }, (_, index) => {
    const setNumberText = String(index + 1).padStart(2, '0');

    return {
      set_id: index + 1,
      set_name: `set${setNumberText}`,
      stim_path: `${IMAGE_ROOT}/set${setNumberText}/`
    };
  });

  // 연습시행용 경로
  // 나중에 연습 전용 이미지를 만들면 `${IMAGE_ROOT}/practice/`처럼 바꾸기
  const TRAINING_IMAGE_ROOT = 'images_training';

const TRAINING_STIMULUS_SETS = [
  {
    set_id: 'training_01',
    set_name: 'training_set01',
    stim_path: `${TRAINING_IMAGE_ROOT}/set01/`,
    direction_label: 'happy_to_angry'
  },
  {
    set_id: 'training_02',
    set_name: 'training_set02',
    stim_path: `${TRAINING_IMAGE_ROOT}/set02/`,
    direction_label: 'angry_to_happy'
  }
];

  function framePath(stimPath, frameNumber) {
    const frameText = String(frameNumber).padStart(FRAME_NUMBER_DIGITS, '0');
    return `${stimPath}frame_${frameText}.png`;
  }

  function makeDynamicFrames(stimPath, directionLabel) {
    const frames = [];

    if (directionLabel === 'happy_to_angry') {
      for (let frameNumber = 1; frameNumber <= N_FRAMES; frameNumber++) {
        frames.push({
          src: framePath(stimPath, frameNumber),
          file_frame_number: frameNumber
        });
      }
    } else {
      for (let frameNumber = N_FRAMES; frameNumber >= 1; frameNumber--) {
        frames.push({
          src: framePath(stimPath, frameNumber),
          file_frame_number: frameNumber
        });
      }
    }

    return frames;
  }

  // =========================================================
  // 2. Preload
  // =========================================================
  const preloadImages = [];

  STIMULUS_SETS.forEach(stimulusSet => {
    for (let frameNumber = 1; frameNumber <= N_FRAMES; frameNumber++) {
      preloadImages.push(framePath(stimulusSet.stim_path, frameNumber));
    }
  });

  TRAINING_STIMULUS_SETS.forEach(trainingSet => {
    for (let frameNumber = 1; frameNumber <= N_FRAMES; frameNumber++) {
     preloadImages.push(framePath(trainingSet.stim_path, frameNumber));
    } 
  });

  const preload = {
    type: jsPsychPreload,
    images: [...new Set(preloadImages)],
    message: '이미지를 불러오는 중입니다. 잠시만 기다려 주세요.',
    error_message: '이미지를 불러오지 못했습니다. images_31/set01/frame_01.png 형식의 경로와 파일명을 확인해 주세요.',
    continue_after_error: false
  };

  // =========================================================
  // 3. Dynamic plugin
  //    한 sequence 안에서 spacebar 2번 응답
  // =========================================================
  class TwoResponseSequencePlugin {
    static info = {
      name: 'two-response-sequence',
      parameters: {}
    };

    constructor(jsPsych) {
      this.jsPsych = jsPsych;
    }

    trial(display_element, trial) {
      const frames = trial.frames;
      const fixationDuration = trial.fixation_duration ?? 200;
      const imageDuration = trial.image_duration ?? 300;
      const responseKey = trial.response_key ?? ' ';
      const feedbackDuration = trial.feedback_duration ?? 150;

      let frameIndex = 0;
      let currentFrameInfo = frames[0];
      let currentSequencePosition = 1;
      let showCheck = false;

      let firstResponseSequencePosition = null;
      let firstResponseFileFrame = null;
      let firstResponseRt = null;

      let secondResponseSequencePosition = null;
      let secondResponseFileFrame = null;
      let secondResponseRt = null;

      const trialStartTime = performance.now();

      let timeoutId = null;
      let feedbackTimeoutId = null;
      let keyboardListener = null;

      function checkHtml() {
        return showCheck
          ? `<div class="check-feedback">✓</div>`
          : `<div class="check-feedback"></div>`;
      }

      function renderFrame(frameInfo) {
        currentFrameInfo = frameInfo;

        display_element.innerHTML = `
          <div class="task-screen">
            <div class="stim-box">
              <img src="${frameInfo.src}" class="stim-img">
            </div>
            ${checkHtml()}
          </div>
        `;
      }

      function renderFixation() {
        display_element.innerHTML = `
          <div class="task-screen">
            <div class="stim-box">
              <div class="fixation-panel">
                <div class="fixation-cross">+</div>
              </div>
            </div>
            ${checkHtml()}
          </div>
        `;
      }

      function flashCheck() {
        showCheck = true;
        renderFrame(currentFrameInfo);

        if (feedbackTimeoutId) {
          clearTimeout(feedbackTimeoutId);
        }

        feedbackTimeoutId = setTimeout(() => {
          showCheck = false;
          renderFrame(currentFrameInfo);
        }, feedbackDuration);
      }

      const endTrial = () => {
        if (keyboardListener) {
          this.jsPsych.pluginAPI.cancelKeyboardResponse(keyboardListener);
        }

        if (timeoutId) clearTimeout(timeoutId);
        if (feedbackTimeoutId) clearTimeout(feedbackTimeoutId);

        display_element.innerHTML = '';

        this.jsPsych.finishTrial({
          ...trial.data,

          task: 'dynamic_two_response',
          response_key: responseKey,

          first_response_sequence_position: firstResponseSequencePosition,
          first_response_file_frame: firstResponseFileFrame,
          first_response_rt: firstResponseRt,

          second_response_sequence_position: secondResponseSequencePosition,
          second_response_file_frame: secondResponseFileFrame,
          second_response_rt: secondResponseRt,

          responded_once: firstResponseSequencePosition !== null,
          responded_twice: secondResponseSequencePosition !== null,

          image_duration_ms: imageDuration,
          fixation_duration_ms: fixationDuration,
          total_frames_shown: frames.length
        });
      };

      keyboardListener = this.jsPsych.pluginAPI.getKeyboardResponse({
        callback_function: () => {
          const currentRt = performance.now() - trialStartTime;

          if (firstResponseSequencePosition === null) {
            firstResponseSequencePosition = currentSequencePosition;
            firstResponseFileFrame = currentFrameInfo.file_frame_number;
            firstResponseRt = currentRt;
            flashCheck();
          } else if (secondResponseSequencePosition === null) {
            secondResponseSequencePosition = currentSequencePosition;
            secondResponseFileFrame = currentFrameInfo.file_frame_number;
            secondResponseRt = currentRt;
            flashCheck();
          }
        },
        valid_responses: [responseKey],
        rt_method: 'performance',
        persist: true,
        allow_held_key: false
      });

      const runStep = () => {
        if (frameIndex >= frames.length) {
          endTrial();
          return;
        }

        currentFrameInfo = frames[frameIndex];
        currentSequencePosition = frameIndex + 1;

        renderFrame(currentFrameInfo);

        timeoutId = setTimeout(() => {
          renderFixation();

          timeoutId = setTimeout(() => {
            frameIndex++;
            runStep();
          }, fixationDuration);

        }, imageDuration);
      };

      runStep();
    }
  }

  // =========================================================
  // 4. Static 3AFC plugin
  //    fixation 200ms + image 300ms
  //    ver.1 random block에서는 키 안내와 체크 표시를 보여줌
  // =========================================================
  class Static3AFCKeyboardPlugin {
    static info = {
      name: 'static-3afc-keyboard',
      parameters: {}
    };

    constructor(jsPsych) {
      this.jsPsych = jsPsych;
    }

    trial(display_element, trial) {
      const imagePath = trial.image_path;
      const fixationDuration = trial.fixation_duration ?? 200;
      const imageDuration = trial.image_duration ?? 300;
      const responseKeys = trial.choices ?? ['ArrowLeft', 'ArrowUp', 'ArrowRight'];
      const feedbackDuration = trial.feedback_duration ?? 150;

      let responded = false;
      let responseKey = null;
      let responseLabel = null;
      let responseRt = null;
      let showCheck = false;

      let imageStartTime = null;

      let keyboardListener = null;
      let timeoutId1 = null;
      let timeoutId2 = null;
      let feedbackTimeoutId = null;

      function checkHtml() {
        return showCheck
          ? `<div class="check-feedback">✓</div>`
          : `<div class="check-feedback"></div>`;
      }

      function renderFixation() {
        display_element.innerHTML = `
          <div class="task-screen">
            <div class="stim-box">
              <div class="fixation-panel">
                <div class="fixation-cross">+</div>
              </div>
            </div>
          </div>
        `;
      }

      function renderImage() {
        display_element.innerHTML = `
          <div class="task-screen">
            <div class="response-cue response-cue-neutral">↑ 무표정</div>
            <div class="response-cue response-cue-angry">← 화남</div>
            <div class="response-cue response-cue-happy">행복 →</div>

            <div class="stim-box">
              <img src="${imagePath}" class="stim-img">
            </div>

            ${checkHtml()}
          </div>
        `;
      }

      function flashCheck() {
        showCheck = true;
        renderImage();

        if (feedbackTimeoutId) {
          clearTimeout(feedbackTimeoutId);
        }

        feedbackTimeoutId = setTimeout(() => {
          showCheck = false;
          renderImage();
        }, feedbackDuration);
      }

      const endTrial = () => {
        if (keyboardListener) {
          this.jsPsych.pluginAPI.cancelKeyboardResponse(keyboardListener);
        }

        if (timeoutId1) clearTimeout(timeoutId1);
        if (timeoutId2) clearTimeout(timeoutId2);
        if (feedbackTimeoutId) clearTimeout(feedbackTimeoutId);

        display_element.innerHTML = '';

        const trueCategory = trial.data?.true_category ?? null;

        this.jsPsych.finishTrial({
          ...trial.data,

          response_key: responseKey,
          response_label: responseLabel,
          rt: responseRt,
          responded: responded,
          correct: responseLabel === null ? null : responseLabel === trueCategory,

          key_mapping: 'ArrowLeft=angry; ArrowUp=neutral; ArrowRight=happy',
          fixation_duration_ms: fixationDuration,
          image_duration_ms: imageDuration
        });
      };

      renderFixation();

      timeoutId1 = setTimeout(() => {
        imageStartTime = performance.now();
        renderImage();

        keyboardListener = this.jsPsych.pluginAPI.getKeyboardResponse({
          callback_function: (info) => {
            if (responded) return;

            responded = true;
            responseKey = info.key;
            responseLabel = keyToResponseLabel(info.key);
            responseRt = performance.now() - imageStartTime;

            flashCheck();
          },
          valid_responses: responseKeys,
          rt_method: 'performance',
          persist: true,
          allow_held_key: false
        });

        timeoutId2 = setTimeout(() => {
          endTrial();
        }, imageDuration);
      }, fixationDuration);
    }
  }

  // =========================================================
  // 5. 안내문
  // =========================================================
  function makeTextScreen(html) {
    return {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div class="instruction-screen">
          <div class="instruction-box">
            ${html}
          </div>
        </div>
      `
    };
  }

  function makeBreakScreen(text) {
    return makeTextScreen(`
      <p>${text}</p>
      <p>잠시 쉬신 뒤 아무 키나 누르면 계속 진행됩니다.</p>
    `);
  }

  const intro = makeTextScreen(`
    <h2>표정 변화 판단 과제</h2>

    <p>각 시행에서는 한 사람의 얼굴 표정이 연속적으로 변화합니다.</p>
    <p>처음에는 감정이 뚜렷한 표정으로 시작해서, 중간에 무표정을 지나, 마지막에는 다른 감정의 표정으로 바뀝니다.</p>
    <p>얼굴이 <strong>무표정에 가까워졌다고 느끼는 순간</strong> 스페이스바를 한 번 누르세요.</p>
    <p>그 후, 다시 <strong>감정이 드러나기 시작했다고 느끼는 순간</strong> 스페이스바를 한 번 더 누르세요.</p>
    <p>버튼을 누른 시점에는 자극 아래에 파란 체크 표시가 잠깐 나타납니다.</p>

    <br>

    <p>먼저 연습시행을 진행합니다.</p>
    <p>아무 키나 누르면 시작합니다.</p>
  `);

  const practiceIntro = makeTextScreen(`
    <h2>연습시행</h2>

    <p>얼굴 표정이 연속적으로 변화합니다.</p>
    <p>스페이스바를 <strong>두 번</strong> 눌러보세요.</p>

    <br>

    <p>1번째 응답: 얼굴이 무표정에 가까워졌다고 느끼는 순간</p>
    <p>2번째 응답: 다시 감정이 드러나기 시작했다고 느끼는 순간</p>

    <br>

    <p>아무 키나 누르면 연습시행이 시작됩니다.</p>
  `);

  const practiceFailFeedback = makeTextScreen(`
    <h2>다시 연습해보겠습니다</h2>

    <p>이번 연습시행에서는 스페이스바가 두 번 눌리지 않았습니다.</p>
    <p>각 시행에서는 스페이스바를 <strong>두 번</strong> 눌러야 합니다.</p>

    <br>

    <p>1번째: 얼굴이 무표정에 가까워졌다고 느끼는 순간</p>
    <p>2번째: 다시 감정이 드러나기 시작했다고 느끼는 순간</p>

    <br>

    <p>아무 키나 누르면 연습시행을 다시 진행합니다.</p>
  `);

  const mainDynamicIntro = makeTextScreen(`
    <h2>본 시행</h2>

    <p>이제 본 시행을 시작합니다.</p>
    <p>각 시행에서 스페이스바를 두 번 누르세요.</p>

    <br>

    <p>1번째 응답: 얼굴이 무표정에 가까워졌다고 느끼는 순간</p>
    <p>2번째 응답: 다시 감정이 드러나기 시작했다고 느끼는 순간</p>

    <br>

    <p>아무 키나 누르면 시작합니다.</p>
  `);

  const randomIntro = makeTextScreen(`
    <h2>다음 과제</h2>

    <p>이번에는 얼굴 이미지가 한 장씩 짧게 제시됩니다.</p>
    <p>각 이미지를 보고 가장 가깝다고 느껴지는 표정을 키보드로 응답하세요.</p>

    <br>

    <p><strong>왼쪽 화살표(←)</strong>: 화남</p>
    <p><strong>위쪽 화살표(↑)</strong>: 무표정</p>
    <p><strong>오른쪽 화살표(→)</strong>: 행복</p>

    <br>

    <p>이미지가 제시되는 동안 화면에도 응답키 안내가 함께 표시됩니다.</p>
    <p>응답이 기록되면 이미지 아래에 파란 체크 표시가 잠깐 나타납니다.</p>

    <br>

    <p>아무 키나 누르면 시작합니다.</p>
  `);

  const endScreen = makeTextScreen(`
    <h2>실험이 완료되었습니다.</h2>
    <p>응답해 주셔서 감사합니다.</p>
  `);

  // =========================================================
  // 6. 연습시행
  // =========================================================
  const practiceTrials = TRAINING_STIMULUS_SETS.map((trainingSet, index) => ({
   type: TwoResponseSequencePlugin,
   frames: makeDynamicFrames(trainingSet.stim_path, trainingSet.direction_label),
   fixation_duration: FIXATION_DURATION_MS,
   image_duration: IMAGE_DURATION_MS,
   response_key: ' ',
   feedback_duration: 150,
   data: {
    block: 'practice_dynamic',
    trial_id: `practice_${index + 1}`,
    set_id: trainingSet.set_id,
    set_name: trainingSet.set_name,
    stim_path: trainingSet.stim_path,
    direction_label: trainingSet.direction_label,
    repeat: 1,
    n_frames: N_FRAMES
    }
  }));

const practiceFailNode = {
  timeline: [practiceFailFeedback],
  conditional_function: function() {
    const recentPracticeTrials = jsPsych.data.get()
      .filter({ block: 'practice_dynamic' })
      .last(TRAINING_STIMULUS_SETS.length)
      .values();

    const completedAllPracticeTrials =
      recentPracticeTrials.length === TRAINING_STIMULUS_SETS.length;

    const respondedTwiceInAllPracticeTrials =
      completedAllPracticeTrials &&
      recentPracticeTrials.every(trial => trial.responded_twice === true);

    return !respondedTwiceInAllPracticeTrials;
  }
};

const practiceLoop = {
  timeline: [
    practiceIntro,
    ...practiceTrials,
    practiceFailNode
  ],
  loop_function: function() {
    const recentPracticeTrials = jsPsych.data.get()
      .filter({ block: 'practice_dynamic' })
      .last(TRAINING_STIMULUS_SETS.length)
      .values();

    const completedAllPracticeTrials =
      recentPracticeTrials.length === TRAINING_STIMULUS_SETS.length;

    const respondedTwiceInAllPracticeTrials =
      completedAllPracticeTrials &&
      recentPracticeTrials.every(trial => trial.responded_twice === true);

    return !respondedTwiceInAllPracticeTrials;
  }
};

  // =========================================================
  // 7. Dynamic 본 시행
  //    2 direction × 10 set × 4 rep = 80 sequence trials
  // =========================================================
  const dynamicConditions = [];
  let dynamicTrialCounter = 1;

  STIMULUS_SETS.forEach(stimulusSet => {
    ['happy_to_angry', 'angry_to_happy'].forEach(directionLabel => {
      for (let rep = 1; rep <= DYNAMIC_REPS; rep++) {
        dynamicConditions.push({
          trial_id: dynamicTrialCounter,
          set_id: stimulusSet.set_id,
          set_name: stimulusSet.set_name,
          stim_path: stimulusSet.stim_path,
          direction_label: directionLabel,
          repeat: rep,
          frames: makeDynamicFrames(stimulusSet.stim_path, directionLabel)
        });

        dynamicTrialCounter++;
      }
    });
  });

  const shuffledDynamicConditions = jsPsych.randomization.shuffle(dynamicConditions);

  const dynamicTrials = shuffledDynamicConditions.map(condition => ({
    type: TwoResponseSequencePlugin,
    frames: condition.frames,
    fixation_duration: FIXATION_DURATION_MS,
    image_duration: IMAGE_DURATION_MS,
    response_key: ' ',
    feedback_duration: 150,
    data: {
      block: 'dynamic',
      trial_id: condition.trial_id,
      set_id: condition.set_id,
      set_name: condition.set_name,
      stim_path: condition.stim_path,
      direction_label: condition.direction_label,
      repeat: condition.repeat,
      n_frames: N_FRAMES,
      objective_neutral_sequence_position: 16,
      objective_neutral_file_frame: 16
    }
  }));

  // =========================================================
  // 8. Random 3AFC
  //    10 set × 11 level × 3 rep = 330 static trials
  // =========================================================
  const randomConditions = [];
  let randomTrialCounter = 1;

  STIMULUS_SETS.forEach(stimulusSet => {
    SELECTED_LEVELS.forEach(level => {
      for (let rep = 1; rep <= RANDOM_REPS; rep++) {
        randomConditions.push({
          trial_id: randomTrialCounter,
          set_id: stimulusSet.set_id,
          set_name: stimulusSet.set_name,
          stim_path: stimulusSet.stim_path,
          repeat: rep,

          frame_number: level.frame,
          image_path: framePath(stimulusSet.stim_path, level.frame),
          true_category: level.true_category,
          emotion_percent: level.emotion_percent,
          emotion_level_label: level.emotion_level_label
        });

        randomTrialCounter++;
      }
    });
  });

  const shuffledRandomConditions = jsPsych.randomization.shuffle(randomConditions);

  const randomTrials = shuffledRandomConditions.map(condition => ({
    type: Static3AFCKeyboardPlugin,
    image_path: condition.image_path,
    choices: RESPONSE_KEYS_3AFC,
    fixation_duration: FIXATION_DURATION_MS,
    image_duration: IMAGE_DURATION_MS,
    feedback_duration: 150,
    data: {
      block: 'random_3afc',
      trial_id: condition.trial_id,
      set_id: condition.set_id,
      set_name: condition.set_name,
      stim_path: condition.stim_path,
      repeat: condition.repeat,

      frame_number: condition.frame_number,
      image_path: condition.image_path,
      true_category: condition.true_category,
      emotion_percent: condition.emotion_percent,
      emotion_level_label: condition.emotion_level_label,

      order_condition: 'random'
    }
  }));

  // =========================================================
  // 9. Timeline
  // =========================================================
  function appendTrialsWithBreaks(timeline, trials, breakEveryNTrials, blockLabel) {
    trials.forEach((trial, index) => {
      timeline.push(trial);

      const trialNumber = index + 1;
      const isBreakPoint = trialNumber % breakEveryNTrials === 0;
      const isLastTrial = trialNumber === trials.length;

      if (isBreakPoint && !isLastTrial) {
        timeline.push(
          makeBreakScreen(`${blockLabel} 진행 중입니다. (${trialNumber} / ${trials.length})`)
        );
      }
    });
  }

  const timeline = [];

  timeline.push(preload);
  timeline.push(intro);
  timeline.push(practiceLoop);

  timeline.push(mainDynamicIntro);
  appendTrialsWithBreaks(
    timeline,
    dynamicTrials,
    DYNAMIC_BREAK_EVERY_N_TRIALS,
    '본 시행'
  );

  timeline.push(makeBreakScreen('첫 번째 과제가 끝났습니다.'));

  timeline.push(randomIntro);
  appendTrialsWithBreaks(
    timeline,
    randomTrials,
    RANDOM_BREAK_EVERY_N_TRIALS,
    '다음 과제'
  );

  timeline.push(endScreen);

  jsPsych.run(timeline);
</script>
