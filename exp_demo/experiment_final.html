<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>설문 + Ver.1 Dynamic + Random 3AFC (통합)</title>

  <script src="https://unpkg.com/jspsych@8.2.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-animation@2.1.0"></script>
  <link href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" rel="stylesheet" type="text/css" />

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: rgb(166, 166, 166); overflow: hidden;
    }
    body.scroll-locked {
     position: fixed;
     inset: 0;
     overflow: hidden;
}
    .jspsych-display-element { background-color: rgb(166, 166, 166); }
    #jspsych-content { max-width: none; }

    .instruction-screen {
      width: 100vw; height: 100vh; background-color: rgb(166, 166, 166);
      display: flex; justify-content: center; align-items: center;
      text-align: center; color: black; font-family: Arial, sans-serif;
    }
    .instruction-box { max-width: 940px; line-height: 1.7; font-size: 20px; padding: 24px 32px; }
    .retry-warning {
      background: #fdecea; border: 1px solid #f5c2c0; border-radius: 8px;
      padding: 14px 18px; margin-bottom: 18px; text-align: left;
    }

    .stim-img { width: 260px; height: 260px; object-fit: contain; }
    .fixation-cross {
      width: 260px; height: 260px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: white; margin: 0 auto;
    }
    .iti-screen { width: 260px; height: 260px; margin: 0 auto; }

    .check-feedback-flash {
      position: fixed;
      left: 50%;
      top: calc(50% + 150px);
      transform: translateX(-50%);
      font-size: 30px;
      font-weight: bold;
      color: #2b6cb0;
      display: none;
      pointer-events: none;
    }

    .response-cue {
      position: absolute; font-family: Arial, sans-serif; font-size: 20px; font-weight: bold;
      color: black; background-color: rgba(166, 166, 166, 0.85); padding: 4px 8px; border-radius: 6px;
    }
    .response-cue-neutral { left: 50%; top: calc(50% - 130px - 48px); transform: translateX(-50%); }
    .response-cue-angry  { right: calc(50% + 130px + 36px); top: 50%; transform: translateY(-50%); }
    .response-cue-happy  { left: calc(50% + 130px + 36px); top: 50%; transform: translateY(-50%); }

    /* ---- 설문 파트 ---- */
    .survey-card {
      max-width: 1100px; margin: 30px auto; padding: 32px 36px;
      background: #fff; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      text-align: left; color: #222; font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
    }
    .missing-warning {
      margin: 12px 0 16px 0; padding: 10px 14px; background: #fff3cd;
      border: 1px solid #ffe08a; border-radius: 8px; color: #6b4e00; font-weight: 700;
    }
    .survey-progress { margin: 10px 0 18px 0; font-weight: 700; color: #333; }
    .jspsych-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .survey-card h1 { margin-top: 0; text-align: center; font-size: 30px; }
    .survey-card h2 { margin-top: 6px; font-size: 24px; }
    .survey-instruction { line-height: 1.7; font-size: 17px; margin-bottom: 24px; text-align: center;}
    .likert-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 15px; }
    .likert-table th, .likert-table td { border: 1px solid #ccc; padding: 10px 8px; vertical-align: middle; }
    .likert-table th { background-color: #f0f2f5; text-align: center; font-weight: 700; }
    .item-no { width: 52px; text-align: center; }
    .item-text { width: 45%; line-height: 1.55; }
    .option-cell { text-align: center; width: 11%; }
    .option-cell input[type="radio"] { transform: scale(1.25); cursor: pointer; }
    .demo-form { max-width: 760px; margin: 0 auto; font-size: 17px; line-height: 1.7; }
    .demo-question { margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid #e4e4e4; }
    .demo-question label { display: block; margin: 7px 0; cursor: pointer; }
    .demo-question input[type="number"], .demo-question input[type="text"] {
      padding: 8px 10px; font-size: 16px; width: 240px; max-width: 90%; border: 1px solid #bbb; border-radius: 6px;
    }
    .small-note { color: #666; font-size: 14px; margin-top: 4px; }
  </style>
</head>

<body></body>

<script>
  // =========================================================
  // 0. jsPsych
  // =========================================================
  const jsPsych = initJsPsych({
    show_progress_bar: true
  });

  const participant_id = jsPsych.randomization.randomID(10);
  jsPsych.data.addProperties({ participant_id: participant_id });

  // =========================================================
  // A. 설문 파트
  // =========================================================
  function buildSurveyTimeline() {
    const staiOptions = [
      { value: 1, label: "거의<br>그렇지<br>않다" },
      { value: 2, label: "가끔<br>그렇다" },
      { value: 3, label: "자주<br>그렇다" },
      { value: 4, label: "언제나<br>그렇다" }
    ];
    const socialAnxietyOptions = [
      { value: 0, label: "전혀<br>그렇지<br>않다" },
      { value: 1, label: "그렇지<br>않다" },
      { value: 2, label: "보통<br>이다" },
      { value: 3, label: "그렇다" },
      { value: 4, label: "매우<br>그렇다" }
    ];
    const cesdOptions = [
      { value: 0, label: "극히<br>드물게<br>(1일 이하)" },
      { value: 1, label: "가끔<br>(1-2일)" },
      { value: 2, label: "자주<br>(3-4일)" },
      { value: 3, label: "거의<br>대부분<br>(5-7일)" }
    ];

    const staiItems = [
      "나는 유쾌하다.", "나는 초조하고 안절부절하다.", "나는 자신에 만족한다.",
      "나도 남들처럼 행복했으면 좋겠다.", "나는 낙오자처럼 느낀다.", "나는 느긋하다.",
      "나는 평온하고 침착하다.", "나는 어려움이 많아서 감당해내지 못할 것 같다.",
      "나는 대수롭지 않은 일에 너무 걱정하는 편이다.", "나는 행복하다.",
      "나는 여러 생각들로 마음이 혼란스럽다.", "나는 자신감이 부족하다.", "나는 안전하다.",
      "나는 어렵지 않게 일을 결정한다.", "나는 자신이 부적절하다고 느낀다.", "나는 만족스럽다.",
      "나는 사소한 생각으로 마음을 쓰고 괴로워한다.", "나는 한 번 낙담하면 헤어나기 힘들다.",
      "나는 쉽게 동요하지 않는다.", "나는 당면한 문제들로 긴장되고 짜증스럽다."
    ];

    const kspsItems = [
      "나는 사람들 앞에서 글을 써야 할 때면 불안해진다.", "공중 화장실을 사용할 때 남의 이목을 의식하게 된다.",
      "내 목소리와 내게 귀 기울이고 있는 다른 사람들이 의식되곤 한다.", "길을 가고 있을 때 사람들이 나를 주시하지 않을까 신경이 쓰인다.",
      "다른 사람들과 함께 있을 때 얼굴이 붉어질까봐 두렵다.", "다른 사람들이 이미 앉아 있는 방에 들어갈 때는 남의 이목을 의식하게 된다.",
      "다른 사람들이 쳐다보고 있을 때 떨게 되지 않을까 걱정된다.", "버스나 기차에서 다른 사람들과 마주앉아야 할 경우 긴장되곤 한다.",
      "다른 사람들에게 정신을 잃거나 병적인 모습을 보이지 않을까 공포스럽다.", "여러 사람들 사이에 있으면 무언가를 마시는 것이 힘들다.",
      "식당에서 낯선 사람들 앞에서 음식을 먹을 때면 남의 이목을 의식하게 된다.", "사람들이 내 행동을 이상하게 생각할까봐 걱정된다.",
      "식판을 들고 번잡한 식당을 가로질러 지나가려면 긴장되곤 한다.", "다른 사람들 앞에서 자제력을 잃지 않을까 걱정된다.",
      "다른 사람의 관심을 끄는 행동을 하게 될까 봐 걱정된다.", "엘리베이터에 있을 때, 다른 사람들이 나를 쳐다보지 않을까 긴장된다.",
      "줄을 서 있을 때, 나만 유난히 눈에 띌 것 같이 느껴진다.", "다른 사람들 앞에서 말을 할 때면 긴장된다.",
      "다른 사람들 앞에서 고개를 가로젓거나 끄덕거릴 것 같아 걱정된다.", "사람들이 나를 쳐다보고 있다는 사실을 알게 되면 거북하고 긴장된다."
    ];

    const ksiasItems = [
      "나보다 높은 지위에 있는 사람과 대화할 때면 긴장된다.", "다른 사람들과 눈을 마주치기가 힘들다.",
      "나 자신이나 내 감정에 대해서 말해야 할 때면 긴장된다.", "동료들과 편안하게 어울리는 것이 어렵다.",
      "길에서 아는 사람을 만나면 긴장된다.", "여러 사람들과 어울리는 것이 불편하다.",
      "다른 사람과 단둘이 있는 상황에서는 긴장된다.", "모임에서 사람들을 만나는 것이 편안하다.",
      "다른 사람들과 이야기하는 것이 어렵다.", "이야깃거리를 쉽게 생각해낸다.",
      "이상하게 보일까 봐 나 자신을 표현하는 것이 걱정된다.", "다른 사람의 주장에 반대하기가 어렵다.",
      "매력적인 이성과 이야기하는 것이 어렵다.", "사회적 상황에서 무엇을 말해야 할지 몰라 걱정하곤 한다.",
      "잘 알지 못하는 사람들과 어울려야 할 때 불편하다.", "대화 도중 부적절한 말을 할 것 같다.",
      "여러 사람들과 어울려 이야기할 때 무시당할까 봐 걱정하곤 한다.", "여러 사람들과 어울릴 때 긴장한다.",
      "잘 알지 못하는 사람에게 인사를 해야 할지 망설인다."
    ];

    const cesdItems = [
      "평소에는 아무렇지도 않던 일들이 귀찮게 느껴졌다.", "입맛이 없었다.",
      "가족이나 친구가 도와주더라도 울적한 기분을 떨쳐 버릴 수 없었다.", "다른 사람들만큼의 능력이 있다고 느꼈다.",
      "무슨 일을 하든 정신을 집중하기가 힘들었다.", "우울했다.",
      "하는 일마다 힘들게 느껴졌다.", "미래에 대하여 희망적으로 느꼈다.",
      "내 인생은 실패작이라는 생각이 들었다.", "두려움을 느꼈다.",
      "잠을 잘 이루지 못했다.", "행복했다.",
      "평소보다 말을 적게 했다.", "세상에 홀로 있는 듯한 외로움을 느꼈다.",
      "사람들이 나에게 차갑게 대하는 것 같았다.", "생활이 즐거웠다.",
      "갑자기 울음이 나왔다.", "슬픔을 느꼈다.",
      "사람들이 나를 싫어하는 것 같았다.", "도무지 무엇을 시작할 기운이 나지 않았다."
    ];

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function makeLikertHtml(items, options, namePrefix) {
      const headerCells = options.map(opt => `<th>${opt.label}</th>`).join("");
      const rows = items.map((item, index) => {
        const itemNumber = index + 1;
        const qName = `${namePrefix}_${String(itemNumber).padStart(2, "0")}`;
        const optionCells = options.map(opt => `
          <td class="option-cell"><input type="radio" name="${qName}" value="${opt.value}" required></td>
        `).join("");
        return `<tr><td class="item-no">${itemNumber}</td><td class="item-text">${escapeHtml(item)}</td>${optionCells}</tr>`;
      }).join("");

      return `
        <div class="missing-warning" id="${namePrefix}_warning">모든 문항에 응답해야 다음으로 넘어갈 수 있습니다.</div>
        <div class="survey-progress" id="${namePrefix}_progress">응답: 0 / ${items.length}</div>
        <table class="likert-table">
          <thead><tr><th class="item-no">번호</th><th class="item-text">문항</th>${headerCells}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function makeLikertTrial({ scaleId, title, instruction, items, options, namePrefix }) {
      let itemResponseTimes = {}; 

      return {
        type: jsPsychSurveyHtmlForm,
        preamble: "",
        html: `<div class="survey-card"><h2>${title}</h2><div class="survey-instruction">${instruction}</div>${makeLikertHtml(items, options, namePrefix)}</div>`,
        button_label: "다음",
        autocomplete: false,
        data: { task: "questionnaire", scale_id: scaleId },
        on_load: function() {
          const button = document.querySelector("#jspsych-survey-html-form-next");
          const warning = document.querySelector(`#${namePrefix}_warning`);
          const progress = document.querySelector(`#${namePrefix}_progress`);
          const trialStartTime = performance.now();
          itemResponseTimes = {};

          function updateProgress() {
            let answered = 0;
            for (let i = 1; i <= items.length; i++) {
              const qName = `${namePrefix}_${String(i).padStart(2, "0")}`;
              if (document.querySelector(`input[name="${qName}"]:checked`)) answered++;
            }
            progress.textContent = `응답: ${answered} / ${items.length}`;
            if (answered === items.length) { warning.style.display = "none"; button.disabled = false; }
            else { warning.style.display = "block"; button.disabled = true; }
          }

          document.querySelectorAll(`input[type="radio"][name^="${namePrefix}_"]`)
            .forEach(input => {
              input.addEventListener("change", function() {
                itemResponseTimes[input.name] = performance.now() - trialStartTime;
                updateProgress();
              });
            });
          updateProgress();
        },
        on_finish: function(data) {
          data.n_items_answered = Object.keys(data.response || {}).length;
          data.item_response_times_ms = itemResponseTimes; 
        }
      };
    }

    const introSurvey = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div class="survey-card">
          <h1>설문지</h1>
          <p class="survey-instruction">
            다음 설문은 평소에 느끼는 정서 및 사회적 상황에서의 생각과 감정에 관한 문항으로 구성되어 있습니다.<br>
            각 문항을 주의 깊게 읽고, 본인에게 가장 잘 해당하는 보기를 선택해 주십시오.
          </p>
          <p style="text-align:center; font-weight:700;">아무 키나 누르면 시작합니다.</p>
        </div>
      `
    };

    const staiTrial = makeLikertTrial({ 
      scaleId: "STAI_Trait", 
      title: "특성 불안 척도(STAI-Trait)", 
      instruction: "다음 각 문항을 잘 읽고 귀하가 평소에 일상적으로 흔히 느끼고 있는 정도를 나타낸 부분을 선택해 주십시오.", 
      items: staiItems, 
      options: staiOptions, 
      namePrefix: "stai" 
    });
    const kspsTrial = makeLikertTrial({ 
      scaleId: "K_SPS", 
      title: "사회적 공포 척도(K-SPS)", 
      instruction: "다음 문항들은 사회적 상황에서 경험할 수 있는 생각과 감정에 대한 것입니다. 각각의 문항들을 주의 깊게 읽으시고, 해당되는 정도를 선택해 주십시오.", 
      items: kspsItems, 
      options: socialAnxietyOptions, 
      namePrefix: "ksps" });
    const ksiasTrial = makeLikertTrial({ 
      scaleId: "K_SIAS", 
      title: "사회적 상호작용 불안 척도(K-SIAS)", 
      instruction: "다음 문항들은 사회적 상황에서 경험할 수 있는 생각과 감정에 대한 것입니다. 각각의 문항들을 주의 깊게 읽으시고, 해당되는 정도를 선택해 주십시오.", 
      items: ksiasItems, 
      options: socialAnxietyOptions, 
      namePrefix: "ksias" });
    const cesdTrial = makeLikertTrial({      
      scaleId: "CES_D",
      title: "우울 척도(CES-D)",
      instruction: "아래에 적혀 있는 문항을 잘 읽으신 후, 지난 1주 동안 귀하께서 느끼시고 행동하신 것을 가장 잘 나타낸다고 생각되는 항목에 표시해 주십시오.",
      items: cesdItems,
      options: cesdOptions,
      namePrefix: "cesd"
    });

    let demographicsItemResponseTimes = {};

    const demographicsTrial = {
      type: jsPsychSurveyHtmlForm,
      preamble: "",
      html: `
        <div class="survey-card">
          <h2>인구 통계학적 정보</h2>
          <p class="survey-instruction">다음 문항은 연구 참여 가능 여부를 확인하기 위한 문항입니다.<br>각 문항에 응답해 주십시오.</p>
          <div class="demo-form">
            <div class="missing-warning" id="screening_warning">모든 문항에 응답해야 다음으로 넘어갈 수 있습니다.</div>
            <div class="survey-progress" id="screening_progress">응답: 0 / 5</div>
            <div class="demo-question"><p><strong>1. 귀하의 만 나이를 작성해 주십시오.</strong> <span class="small-note">(예: 23)</span></p><input type="number" name="age" min="1" max="120"></div>
            <div class="demo-question"><p><strong>2. 귀하의 생물학적 성별은 무엇입니까?</strong></p>
              <label><input type="radio" name="biological_sex" value="female"> 여성</label>
              <label><input type="radio" name="biological_sex" value="male"> 남성</label></div>
            <div class="demo-question"><p><strong>3. 귀하의 나안 또는 교정 시력은 0.8 이상입니까?</strong></p>
              <label><input type="radio" name="vision_08_or_above" value="yes"> 예</label>
              <label><input type="radio" name="vision_08_or_above" value="no"> 아니오</label></div>
            <div class="demo-question"><p><strong>4. 귀하는 색맹 또는 색약 진단을 받은 적이 있습니까?</strong></p>

    function attachFlashFeedback(trialObject, responseKeys) {
    let listenerId = null;
    let hideTimeoutId = null;
    let feedbackEl = null;

    const originalOnLoad = trialObject.on_load;
    trialObject.on_load = function() {
      if (originalOnLoad) originalOnLoad();

      feedbackEl = document.createElement('div');
      feedbackEl.className = 'check-feedback-flash';
      feedbackEl.textContent = '✓';
      document.body.appendChild(feedbackEl);

      listenerId = jsPsych.pluginAPI.getKeyboardResponse({
        callback_function: function() {
          feedbackEl.style.display = 'block';
          if (hideTimeoutId) clearTimeout(hideTimeoutId);
          hideTimeoutId = setTimeout(function() {
            feedbackEl.style.display = 'none';
          }, 150);
        },
        valid_responses: responseKeys,
        rt_method: 'performance',
        persist: true,
        allow_held_key: false
      });
    };

    const originalOnFinish = trialObject.on_finish;
    trialObject.on_finish = function(data) {
      if (listenerId) jsPsych.pluginAPI.cancelKeyboardResponse(listenerId);
      if (hideTimeoutId) clearTimeout(hideTimeoutId);
      if (feedbackEl && feedbackEl.parentNode) {
        feedbackEl.parentNode.removeChild(feedbackEl);
      }
      if (originalOnFinish) originalOnFinish(data);
    };

    return trialObject;
  }

  function buildDynamicSequence(directionLabel, stimulusSet, repeat, baseSequenceId, isPractice) {
  const frames = makeDynamicFrames(stimulusSet.stim_path, directionLabel);
  let runNumber = 0;
  const currentSequenceUid = () => `${baseSequenceId}_run${runNumber}`;

  const frameLookup = {};
  frames.forEach((f, idx) => {
    frameLookup[f.src] = { sequence_position: idx + 1, file_frame_number: f.file_frame_number };
  });

  const baseData = (extra) => () => ({
    block: isPractice ? 'practice_dynamic' : 'dynamic',
    sequence_uid: currentSequenceUid(),
    direction_label: directionLabel,
    set_id: stimulusSet.set_id,
    set_name: stimulusSet.set_name,
    stim_path: stimulusSet.stim_path,
    repeat: repeat,
    ...extra
  });

  const itiTrial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div class="iti-screen"></div>',
    choices: 'NO_KEYS',
    trial_duration: ITI_DURATION_MS,
    on_start: function() { runNumber++; },
    data: baseData({ phase: 'iti' })
  };

  const animationTrial = attachFlashFeedback({
    type: jsPsychAnimation,
    stimuli: frames.map(f => f.src),
    frame_time: IMAGE_DURATION_MS,
    frame_isi: FIXATION_DURATION_MS,
    choices: [' '],
    render_on_canvas: false, 
    data: baseData({ phase: 'animation' }),
    on_finish: function(data) {
      const responses = data.response || [];
      const sequence = data.animation_sequence || [];

      function resolveByTime(rt) {
        let matched = null;
        for (const entry of sequence) {
          if (entry.time > rt) break;
          if (entry.stimulus !== 'blank') matched = entry;
        }
        return matched ? frameLookup[matched.stimulus] : null;
      }

      const resolved = responses.map(r => ({ ...(resolveByTime(r.rt) || {}), rt: r.rt }));

      data.response_count = resolved.length;
      data.first_response_sequence_position = resolved[0]?.sequence_position ?? null;
      data.first_response_file_frame = resolved[0]?.file_frame_number ?? null;
      data.first_response_rt = resolved[0]?.rt ?? null;
      data.second_response_sequence_position = resolved[1]?.sequence_position ?? null;
      data.second_response_file_frame = resolved[1]?.file_frame_number ?? null;
      data.second_response_rt = resolved[1]?.rt ?? null;
    }
  }, [' ']);

  return { trials: [itiTrial, animationTrial], getCurrentSequenceUid: currentSequenceUid };
}

function countResponsesInSequence(sequenceUid) {
  const row = jsPsych.data.get()
    .filter({ sequence_uid: sequenceUid, phase: 'animation' })
    .values()[0];
  return row && row.response ? row.response.length : 0;
}

    stimulus: `<div class="instruction-screen"><div class="instruction-box">
      <h2>실험이 완료되었습니다.</h2>
      <p>응답해 주셔서 감사합니다.</p>
    </div></div>`,
    choices: 'NO_KEYS',
    trial_duration: null
  };

  // ---- 6. 연습 시행: 2 set x 2 direction = 4 sequences ----
  const practiceSequenceBuilders = [];
  TRAINING_STIMULUS_SETS.forEach((trainingSet, setIdx) => {
    ['happy_to_angry', 'angry_to_happy'].forEach((direction, dirIdx) => {
      practiceSequenceBuilders.push(
        buildDynamicSequence(direction, trainingSet, 1, `practice_${setIdx}_${dirIdx}`, true)
      );
    });
  });

  const practiceTrialsFlat = practiceSequenceBuilders.flatMap(b => b.trials);

  const practiceLoop = {
    timeline: [practiceIntro, ...practiceTrialsFlat],
    loop_function: function() {
      const allPassed = practiceSequenceBuilders.every(b =>
        countResponsesInSequence(b.getCurrentSequenceUid()) === 2
      );
      if (allPassed) {
        dynamicPracticePassed = true;
        return false;
      }
      if (practiceAttemptNumber >= MAX_PRACTICE_ATTEMPTS) {
        dynamicPracticePassed = false;
        return false;
      }
      return true;
    }
  };

  // ---- 7. Dynamic 본 시행: 2 direction x 10 set x 4 rep = 80 sequences ----
  const dynamicConditions = [];
  for (let rep = 1; rep <= DYNAMIC_REPS; rep++) {
    const chunk = [];
    STIMULUS_SETS.forEach(s => {
      ['happy_to_angry', 'angry_to_happy'].forEach(direction => {
        chunk.push({ set: s, direction, rep });
      });
    });
    const shuffledChunk = jsPsych.randomization.shuffle(chunk);
    dynamicConditions.push(...shuffledChunk);
  }

  const shuffledDynamicConditions = dynamicConditions;

  const dynamicTimelineTrials = [];
  shuffledDynamicConditions.forEach((cond, i) => {
    const baseId = `dyn_${cond.set.set_id}_${cond.direction}_rep${cond.rep}`;
    const { trials } = buildDynamicSequence(cond.direction, cond.set, cond.rep, baseId, false);
    dynamicTimelineTrials.push(...trials);

    const sequenceNumber = i + 1;
    const isBreakPoint = sequenceNumber % DYNAMIC_BREAK_EVERY_N_SEQUENCES === 0;
    const isLast = sequenceNumber === shuffledDynamicConditions.length;
    if (isBreakPoint && !isLast) {
      const currentBlock = sequenceNumber / DYNAMIC_BREAK_EVERY_N_SEQUENCES;
      const totalBlocks = shuffledDynamicConditions.length / DYNAMIC_BREAK_EVERY_N_SEQUENCES;
      dynamicTimelineTrials.push(makeBreakScreen(currentBlock, totalBlocks));
    }
  });

  // ---- 8. Random 3AFC: 10 set x 11 level x 3 rep = 330 trials ----
  const randomConditions = [];
  STIMULUS_SETS.forEach(s => {
    SELECTED_LEVELS.forEach(level => {
      for (let rep = 1; rep <= RANDOM_REPS; rep++) {
        randomConditions.push({
          trial_id: `random_${s.set_id}_${level.emotion_level_label}_rep${rep}`,
          set_id: s.set_id, set_name: s.set_name, stim_path: s.stim_path, repeat: rep,
          frame_number: level.frame, image_path: framePath(s.stim_path, level.frame),
          true_category: level.true_category, emotion_percent: level.emotion_percent,
          emotion_level_label: level.emotion_level_label
        });
      }
    });
  });
  const shuffledRandomConditions = jsPsych.randomization.shuffle(randomConditions);

 function makeRandom3AFCTrials(condition) {
  const commonData = {
    block: 'random_3afc',
    order_condition: 'random',
    trial_id: condition.trial_id,
    set_id: condition.set_id,
    set_name: condition.set_name,
    stim_path: condition.stim_path,
    repeat: condition.repeat,
    frame_number: condition.frame_number,
    image_path: condition.image_path,
    true_category: condition.true_category,
    emotion_percent: condition.emotion_percent,
    emotion_level_label: condition.emotion_level_label
  };

  return [
    {
      type: jsPsychHtmlKeyboardResponse,

      stimulus: `
        <div id="random-stimulus-area">
          <img src="${condition.image_path}" class="stim-img">
        </div>
      `,

      choices: RESPONSE_KEYS_3AFC,

      trial_duration: RANDOM_IMAGE_DURATION_MS + RANDOM_GAP_DURATION_MS,

      response_ends_trial: false,

      data: {
        ...commonData,
        phase: 'random_trial',
        image_duration_ms: RANDOM_IMAGE_DURATION_MS,
        gap_duration_ms: RANDOM_GAP_DURATION_MS,
        total_trial_duration_ms: RANDOM_IMAGE_DURATION_MS + RANDOM_GAP_DURATION_MS
      },

      on_load: function() {
        setTimeout(function() {
          const area = document.querySelector('#random-stimulus-area');
          if (area) {
            area.innerHTML = '<div class="iti-screen"></div>';
          }
        }, RANDOM_IMAGE_DURATION_MS);
      },

      on_finish: function(data) {
        data.response_label = keyToResponseLabel(data.response);
        data.correct = data.response_label === null
          ? null
          : data.response_label === condition.true_category;
      }
    }
  ];
}

// ---- Random 3AFC 연습 ----
const RANDOM_PRACTICE_MAX_ATTEMPTS = 6;
const RANDOM_TRAINING_LEVELS = [
  SELECTED_LEVELS[0],
  SELECTED_LEVELS[5],
  SELECTED_LEVELS[10]
];

const randomPracticeConditionsBase = [];
TRAINING_STIMULUS_SETS.forEach(set => {
  RANDOM_TRAINING_LEVELS.forEach(level => {
    randomPracticeConditionsBase.push({
      trial_id: `practice_random_${set.set_id}_${level.emotion_level_label}`,
      set_id: set.set_id,
      set_name: set.set_name,
      stim_path: set.stim_path,
      repeat: 1,
      frame_number: level.frame,
      image_path: framePath(set.stim_path, level.frame),
      true_category: level.true_category,
      emotion_percent: level.emotion_percent,
      emotion_level_label: level.emotion_level_label
    });
  });
});

let randomPracticeAttemptNumber = 0;
let currentRandomPracticeConditions = [];

function makeRandomPracticeTrial(slotIndex) {
  return {
    type: jsPsychHtmlKeyboardResponse,

    stimulus: function() {
      const condition = currentRandomPracticeConditions[slotIndex];

      return `
        <div id="random-stimulus-area">
          <img src="${condition.image_path}" class="stim-img">
        </div>
      `;
    },

    choices: RESPONSE_KEYS_3AFC,
    trial_duration: RANDOM_IMAGE_DURATION_MS + RANDOM_GAP_DURATION_MS,
    response_ends_trial: false,

    data: {
      block: 'practice_random_3afc',
      phase: 'random_trial'
    },

    on_load: function() {
      setTimeout(function() {
        const area = document.querySelector('#random-stimulus-area');
        if (area) {
          area.innerHTML = '<div class="iti-screen"></div>';
        }
      }, RANDOM_IMAGE_DURATION_MS);
    },

    on_finish: function(data) {
      const condition = currentRandomPracticeConditions[slotIndex];

      data.practice_attempt = randomPracticeAttemptNumber;
      data.practice_slot = slotIndex + 1;
      data.trial_id = condition.trial_id;
      data.set_id = condition.set_id;
      data.set_name = condition.set_name;
      data.stim_path = condition.stim_path;
      data.repeat = condition.repeat;
      data.frame_number = condition.frame_number;
      data.image_path = condition.image_path;
      data.true_category = condition.true_category;
      data.emotion_percent = condition.emotion_percent;
      data.emotion_level_label = condition.emotion_level_label;
      data.image_duration_ms = RANDOM_IMAGE_DURATION_MS;
      data.gap_duration_ms = RANDOM_GAP_DURATION_MS;
      data.total_trial_duration_ms = RANDOM_IMAGE_DURATION_MS + RANDOM_GAP_DURATION_MS;

      data.response_label = keyToResponseLabel(data.response);
      data.correct = data.response_label === null
        ? null
        : data.response_label === condition.true_category;
    }
  };
}

const randomPracticeTrialsFlat = Array.from(
  { length: randomPracticeConditionsBase.length },
  (_, i) => makeRandomPracticeTrial(i)
);

const randomPracticeIntro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: function() {
    const nextAttempt = randomPracticeAttemptNumber + 1;

    if (nextAttempt === 1) {
      return `
        <div class="instruction-screen"><div class="instruction-box">
          <h2>연습시행</h2>
          <p>얼굴 이미지가 한 장씩 제시됩니다. 화살표 키로 응답해주세요.</p>
          <br>
          <p><strong>왼쪽 화살표(←)</strong>: 화남</p>
          <p><strong>위쪽 화살표(↑)</strong>: 무표정</p>
          <p><strong>오른쪽 화살표(→)</strong>: 행복</p>
          <br>
          <p>총 6장의 연습 이미지가 제시됩니다.</p>
          <p>각 이미지마다 반드시 세 화살표 키 중 하나로 응답해 주세요.</p>
          <br>
          <p>아무 키나 누르면 연습시행이 시작됩니다.</p>
        </div></div>
      `;
    }

    return `
      <div class="instruction-screen"><div class="instruction-box">
        <div class="retry-warning">
          <p>방금 연습시행 중 응답하지 않고 지나간 이미지가 있었습니다.</p>
          <p>다시 한 번 연습시행을 진행합니다.</p>
          <p><strong>현재 ${nextAttempt}번째 연습입니다. (최대 ${RANDOM_PRACTICE_MAX_ATTEMPTS}회)</strong></p>
        </div>
        <p><strong>왼쪽 화살표(←)</strong>: 화남 &nbsp;&nbsp; <strong>위쪽 화살표(↑)</strong>: 무표정 &nbsp;&nbsp; <strong>오른쪽 화살표(→)</strong>: 행복</p>
        <br>
        <p>아무 키나 누르면 연습시행을 다시 진행합니다.</p>
      </div></div>
    `;
  },
  choices: 'ALL_KEYS',
  on_finish: function() {
    randomPracticeAttemptNumber++;
    currentRandomPracticeConditions = jsPsych.randomization.shuffle([...randomPracticeConditionsBase]);
  }
};

const randomPracticeLoop = {
  timeline: [randomPracticeIntro, ...randomPracticeTrialsFlat],
  loop_function: function() {
    const recentPracticeImages = jsPsych.data.get()
      .filter({ block: 'practice_random_3afc', phase: 'random_trial' })
      .last(randomPracticeConditionsBase.length)
      .values();

    const allResponded = recentPracticeImages.length === randomPracticeConditionsBase.length &&
      recentPracticeImages.every(t => t.response !== null);

    if (allResponded) return false;
    if (randomPracticeAttemptNumber >= RANDOM_PRACTICE_MAX_ATTEMPTS) return false;
    return true;
  }
};
  

  const randomTimelineTrials = [];
  shuffledRandomConditions.forEach((cond, i) => {
    randomTimelineTrials.push(...makeRandom3AFCTrials(cond));
    const trialNumber = i + 1;
    const isBreakPoint = trialNumber % RANDOM_BREAK_EVERY_N_TRIALS === 0;
    const isLast = trialNumber === shuffledRandomConditions.length;
    if (isBreakPoint && !isLast) {
      const currentBlock = trialNumber / RANDOM_BREAK_EVERY_N_TRIALS;
      const totalBlocks = shuffledRandomConditions.length / RANDOM_BREAK_EVERY_N_TRIALS;
      randomTimelineTrials.push(makeBreakScreen(currentBlock, totalBlocks));
    }
  });

  // =========================================================
  // 전체 timeline
  // =========================================================
    const dynamicPracticeFailedNode = {
    timeline: [dynamicPracticeFailedScreen],
    conditional_function: function() { return !dynamicPracticePassed; }
  };

    const afterDynamicPracticeNode = {
    timeline: [
      mainDynamicIntro,
      ...dynamicTimelineTrials,
      makeTextScreen(`<p>첫 번째 과제가 끝났습니다.</p><p>잠시 휴식하신 후, 준비되시면 아무 키나 눌러주세요.</p>`),
      randomIntro,
      randomPracticeLoop,
      mainRandomIntro,
      ...randomTimelineTrials,
      contactInfoTrial,
      endScreen
    ],
    conditional_function: function() { return dynamicPracticePassed; }
  };

  const ineligibleNode = {
  timeline: [survey.ineligibleEnd],
  conditional_function: function() {
    const demoData = jsPsych.data.get().filter({ scale_id: "demographics" }).last(1).values()[0];
    return demoData.eligible === false;
  }
};

  const eligibleFullExperimentNode = {
    timeline: [
      survey.staiTrial,
      survey.kspsTrial,
      survey.ksiasTrial,
      survey.cesdTrial,
      survey.surveyToExperimentTransition,
      preload,
      instruction,
      practiceLoop,
      dynamicPracticeFailedNode,
      afterDynamicPracticeNode
    ],
    conditional_function: function() {
      const demoData = jsPsych.data.get().filter({ scale_id: "demographics" }).last(1).values()[0];
      return demoData.eligible === true;
    }
  };

  const timeline = [
    fullscreenTrial,
    survey.introSurvey,
    survey.demographicsTrial,
    ineligibleNode,
    eligibleFullExperimentNode
  ];

  jsPsych.run(timeline);
</script>
